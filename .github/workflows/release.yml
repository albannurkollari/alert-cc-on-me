name: Release

# Every merge into main (the promotion PR) that carries a feat, fix or breaking change
# publishes stable vX.Y.Z after approval in the `stable` environment: a tag, a GitHub
# Release and uploads to CurseForge, Wago and WoWInterface. The version comes from the
# Conventional Commits since the last stable tag. Merges into beta ship as untagged alpha
# builds instead (alpha.yml).
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Next version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Merges in quick succession: only the run for the branch tip releases, and it
      # carries the earlier commits too. A tag on an older commit would also be refused
      # if a later merge changed workflow files.
      - id: next
        name: Derive from commits
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            tag=""
            summary="No release: main has moved on to ${tip:0:7}, whose run releases these commits too."
          else
            tag=$(scripts/next-version.sh)
            summary="${tag:-No release: no feat, fix or breaking change since the last stable release.}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ needs.version.outputs.tag }}
    needs: [version, test]
    runs-on: ubuntu-24.04
    # Holds the upload tokens and waits for approval.
    environment: stable
    permissions:
      contents: write
    env:
      # Sites without a token or a project ID in the .toc are skipped.
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The packager reads the version from the tag on HEAD, and the GitHub Release it
      # creates attaches to that tag. Checked again here: main may move on during approval.
      - id: tag
        name: Tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "No release: main moved on while waiting; its run releases these commits." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi

      # The packager skips a branch push whose commit is tagged, expecting a separate
      # build for the tag push, but a tag pushed with GITHUB_TOKEN starts no workflow.
      # So run the same scripts BigWigsMods/packager@v2 runs, presented as that tag build.
      - name: Package and publish
        if: steps.tag.outputs.current == 'true'
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git clone --quiet --depth 1 --branch v2 https://github.com/BigWigsMods/packager.git "$RUNNER_TEMP/packager"
          export GITHUB_REF="refs/tags/$TAG" GITHUB_REF_NAME="$TAG"
          "$RUNNER_TEMP/packager/setup-packager.sh"
          "$RUNNER_TEMP/packager/release.sh"
