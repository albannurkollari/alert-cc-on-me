<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 400" width="1600" height="400">
  <title>Alert CC On Me banner</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f2d"/>
      <stop offset="1" stop-color="#0b0d14"/>
    </linearGradient>
    <radialGradient id="flare" cx="0.18" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#ff4d4d" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="castbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#d91e3a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="400" fill="url(#sky)"/>
  <rect width="1600" height="400" fill="url(#flare)"/>

  <image href="logo.svg" xlink:href="logo.svg" x="80" y="60" width="280" height="280"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="430" y="175" font-size="96" font-weight="700" fill="#f3f5fa">Alert CC On Me</text>
    <text x="434" y="235" font-size="38" fill="#aab2c8">Hear it, see it, interrupt it before it lands.</text>
  </g>

  <!-- A cast bar caught mid-cast. -->
  <rect x="434" y="275" width="660" height="26" rx="13" fill="#353b52"/>
  <rect x="434" y="275" width="530" height="26" rx="13" fill="url(#castbar)"/>
  <text x="1122" y="297" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffd23f">Polymorph on YOU!</text>
</svg>
