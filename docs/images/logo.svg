<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Alert CC On Me</title>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262b3d"/>
      <stop offset="1" stop-color="#0e1019"/>
    </linearGradient>
    <linearGradient id="cast" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#d91e3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4d4d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#badge)"/>
  <circle cx="256" cy="256" r="210" fill="url(#glow)"/>

  <!-- Cast bar bent into a ring: the empty track, then ~80% progress from 12 o'clock. -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#353b52" stroke-width="36"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#cast)" stroke-width="36"
          stroke-linecap="round" stroke-dasharray="884 1106" transform="rotate(-90 256 256)"/>

  <!-- Crosshair ticks: you are the target. -->
  <g stroke="#c9cfdf" stroke-width="20" stroke-linecap="round">
    <line x1="256" y1="110" x2="256" y2="134"/>
    <line x1="256" y1="378" x2="256" y2="402"/>
    <line x1="110" y1="256" x2="134" y2="256"/>
    <line x1="378" y1="256" x2="402" y2="256"/>
  </g>

  <!-- The alert. -->
  <g fill="#ffd23f">
    <rect x="232" y="150" width="48" height="128" rx="24"/>
    <circle cx="256" cy="322" r="27"/>
  </g>
</svg>
